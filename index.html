  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; background: var(--ink); color: var(--snow); overflow-x: hidden; }
  .hero { position: relative; height: 300px; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: -30px; background: var(--photo) center/cover; filter: blur(14px) saturate(1.15); }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,13,18,0) 30%, var(--ink) 100%); }
  .streak { position: absolute; top: -40px; right: 14%; width: 16px; height: 420px; background: var(--red); transform: rotate(22deg); z-index: 1; opacity: .9; }
  main { position: relative; z-index: 2; margin-top: -92px; display: flex; flex-direction: column; align-items: center; padding: 0 16px 48px; }
  .avatar { width: 150px; height: 150px; border-radius: 50%; background: var(--photo) center/cover; border: 4px solid var(--snow); box-shadow: 0 0 0 4px var(--red), 0 10px 30px rgba(0,0,0,.5); }
  h1 { margin: 22px 0 6px; font-size: 2rem; letter-spacing: .5px; }
